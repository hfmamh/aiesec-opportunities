name: Sync opportunities & convocatorias

on:
  schedule:
    - cron: "0 */4 * * *" # every 4 hours, on the hour (00:00, 04:00, ... UTC)
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # Runs both pipelines (AIESEC opportunities + convocatorias del Estado
      # peruano). Each source is wrapped independently in scripts/sync.py's
      # main(): one failing doesn't stop the other, and the job only fails
      # (non-zero exit) if at least one source failed.
      - run: python scripts/sync.py
        env:
          AIESEC_API_KEY: ${{ secrets.AIESEC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
